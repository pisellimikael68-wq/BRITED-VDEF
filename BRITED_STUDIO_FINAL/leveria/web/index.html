<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bibliothèque de tournage · BRITED Studio</title>
  <script>if(location.protocol==='file:')location.replace('http://127.0.0.1:8766/');</script>
  <style>
    :root{--ink:#282b28;--green:#31594b;--soft:#e9f1ed;--paper:#f6f7f5;--line:#dce2de;--muted:#707772;--error:#8b332d}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(18px,5vw,56px);background:#fffc;border-bottom:1px solid var(--line)}
    .brand{font-size:20px;font-weight:850}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500}.local{color:var(--green);font-size:12px;font-weight:750}
    main{width:min(1040px,calc(100% - 30px));margin:40px auto 70px}h1{font-size:clamp(30px,5vw,46px);line-height:1.08;margin:0 0 8px}.sub{color:var(--muted);font-size:17px;margin:0 0 25px}
    .nav{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:22px}.nav input,.btn{border:1px solid #cbd5cf;border-radius:10px;background:#fff;color:var(--ink);padding:11px 14px;font:inherit}.nav input{font-weight:750}.btn{cursor:pointer;font-weight:800}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn:focus-visible,input:focus-visible{outline:3px solid #93b8aa;outline-offset:2px}
    #status{min-height:26px;margin:8px 0 18px;color:var(--muted)}#status[aria-busy=true]{color:var(--green)}.error{padding:15px;border:1px solid #e2c1bd;border-radius:12px;background:#fff3f1;color:var(--error)}
    .stack{display:grid;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(22px,4vw,32px);box-shadow:0 10px 35px #23372e0a}.card.draft{border-color:#e0c890;background:#fffdf7}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{display:inline-flex;padding:5px 10px;border-radius:999px;background:#edf2ef;color:#4d6259;font-size:12px;font-weight:800}.pill.ok{background:#e1f2ea;color:#195f49}.pill.pending{background:#fff0c8;color:#74530d}h2{font-size:23px;line-height:1.25;margin:14px 0 0}.script{white-space:pre-wrap;font:19px/1.75 Georgia,"Times New Roman",serif;margin-top:22px}.empty{text-align:center;padding:42px 20px;border:1px dashed #cbd5cf;border-radius:14px;color:var(--muted);background:#fff}.summary{font-weight:750;color:var(--green)}.date-heading{font-size:20px;color:var(--green);margin:30px 0 8px;text-transform:capitalize}.warning{font-size:13px;color:#74530d;margin:12px 0 0}
    .programme{margin-top:52px}.programme h2{font-size:28px;margin-bottom:4px}.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:18px}.day{appearance:none;text-align:left;background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;cursor:pointer;color:inherit;font:inherit}.day:hover,.day:focus-visible{border-color:#87aa9c;box-shadow:0 8px 24px #23372e10}.day.active{border:2px solid var(--green)}.day-date{font-weight:850;color:var(--green)}.day-theme{font-weight:800;margin:5px 0 9px}.topic{font-size:14px;color:#4f5752;margin:4px 0}.planned{color:var(--muted);font-size:12px;margin-top:10px}
    @media(max-width:620px){header{padding:15px}.local{display:none}main{margin-top:25px}.head{display:block}.copy{margin-top:14px}.script{font-size:18px}}
  </style>
</head>
<body>
  <header><div class="brand">BRITED Studio<small>Scripts face caméra</small></div><div class="local">● Accessible localement</div></header>
  <main>
    <h1>Bibliothèque de tournage</h1>
    <p class="sub">Consultez une journée ou préparez vos tournages sur les 14 prochains jours.</p>
    <div class="nav" aria-label="Choisir le jour">
      <button class="btn" id="previous" type="button" aria-label="Jour précédent">←</button>
      <label for="date">Date</label><input id="date" type="date">
      <button class="btn" id="next" type="button" aria-label="Jour suivant">→</button>
      <button class="btn primary" id="show" type="button">Afficher</button>
      <button class="btn" id="show14" type="button">Afficher les 14 jours</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
    <section id="scripts" class="stack" aria-label="Scripts prêts"></section>
    <section class="programme" aria-labelledby="programme-title">
      <h2 id="programme-title">Programme à venir</h2>
      <p class="sub">La base éditoriale initiale, réordonnée du plus universel au plus spécialisé.</p>
      <div id="days" class="days"></div>
    </section>
  </main>
  <script>
    const $=selector=>document.querySelector(selector);
    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    let requestController;
    function localDate(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
    async function loadScripts(){
      requestController?.abort();requestController=new AbortController();
      const timeout=setTimeout(()=>requestController.abort(),8000),day=$('#date').value;
      $('#status').setAttribute('aria-busy','true');$('#status').textContent='Chargement…';$('#scripts').innerHTML='';
      try{
        const days=Number(arguments[0]||1);
        const response=await fetch('/api/shooting-library?start='+encodeURIComponent(day)+'&days='+days,{signal:requestController.signal,cache:'no-store'});
        if(!response.ok)throw new Error('Le service local ne répond pas correctement.');
        const data=await response.json();
        $('#status').className='summary';
        $('#status').textContent=`${data.scripts.length} texte${data.scripts.length>1?'s':''} affiché${data.scripts.length>1?'s':''} · ${data.ready} finalisé${data.ready>1?'s':''} · ${data.drafts} en adaptation`;
        if(!data.scripts.length){$('#scripts').innerHTML='<div class="empty">Aucun texte finalisé à afficher.</div>';return}
        let previousDate='';
        $('#scripts').innerHTML=data.scripts.map(item=>{const heading=item.date!==previousDate?`<h2 class="date-heading">${new Date(item.date+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</h2>`:'';previousDate=item.date;return `${heading}<article class="card ${item.status==='draft'?'draft':''}"><div class="head"><div><div class="meta"><span class="pill">${escapeHtml(item.time)}</span>${item.status==='final'?`<span class="pill ok">Finalisé 10/10 · ${item.agents} contrôles</span>`:'<span class="pill pending">Adaptation face caméra en cours</span>'}${item.impactValidated?'<span class="pill ok">Hook & dynamisme validés</span>':''}</div><h2>${escapeHtml(item.title)}</h2></div><button class="btn copy" type="button">Copier le texte</button></div><div class="script">${escapeHtml(item.text||'Texte en cours de préparation.')}</div>${item.status==='draft'?'<p class="warning">Visible pour préparer votre planning, mais à ne pas tourner avant la certification finale.</p>':''}</article>`}).join('');
        document.querySelectorAll('.copy').forEach(button=>button.addEventListener('click',()=>copyText(button)));
      }catch(error){
        if(error.name==='AbortError'&&requestController.signal.aborted){
          $('#status').textContent='Le chargement a pris trop de temps.';
        }else $('#status').textContent='Accès temporairement indisponible.';
        $('#status').className='error';
        $('#scripts').innerHTML='<button class="btn primary" id="retry" type="button">Réessayer</button>';
        $('#retry').onclick=loadScripts;
      }finally{clearTimeout(timeout);$('#status').setAttribute('aria-busy','false')}
    }
    async function loadPlan(){
      try{
        const response=await fetch('/api/editorial-plan',{cache:'no-store'});if(!response.ok)throw new Error();
        const data=await response.json();
        $('#days').innerHTML=data.days.map(day=>`<button class="day${day.date===$('#date').value?' active':''}" type="button" data-date="${escapeHtml(day.date)}"><div class="day-date">${new Date(day.date+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div><div class="day-theme">${escapeHtml(day.theme)}</div>${day.topics.map(topic=>`<div class="topic">${topic.slot}. ${escapeHtml(topic.title)}</div>`).join('')}<div class="planned">${day.ready?day.ready+' script'+(day.ready>1?'s':'')+' finalisé'+(day.ready>1?'s':''):'Adaptation face caméra à finaliser'}</div></button>`).join('');
        document.querySelectorAll('.day').forEach(button=>button.onclick=()=>{$('#date').value=button.dataset.date;loadScripts();loadPlan()});
      }catch(_){$('#days').innerHTML='<div class="empty">Le programme sera de nouveau disponible dans un instant.</div>'}
    }
    async function copyText(button){
      const text=button.closest('.card').querySelector('.script').textContent;
      try{await navigator.clipboard.writeText(text)}catch(_){const area=document.createElement('textarea');area.value=text;document.body.append(area);area.select();document.execCommand('copy');area.remove()}
      button.textContent='Copié ✓';setTimeout(()=>button.textContent='Copier le texte',1500);
    }
    function move(days){const value=new Date($('#date').value+'T12:00:00');value.setDate(value.getDate()+days);$('#date').value=value.toISOString().slice(0,10);loadScripts();loadPlan()}
    $('#date').value=localDate();$('#show').onclick=()=>{loadScripts(1);loadPlan()};$('#show14').onclick=()=>loadScripts(14);$('#date').onchange=()=>{loadScripts(1);loadPlan()};$('#previous').onclick=()=>move(-1);$('#next').onclick=()=>move(1);
    loadScripts();loadPlan();
  </script>
</body>
</html>
